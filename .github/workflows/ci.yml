name: Wavii.io CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Typecheck, Build, and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Strict TypeScript Check
        run: pnpm exec tsc --noEmit

      - name: Run Production Next.js Build
        run: pnpm build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/wavii-repo/wavii-io:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/wavii-repo/wavii-io:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy wavii-io \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/wavii-repo/wavii-io:latest \
            --region us-central1 \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars SEATGEEK_API_KEY=${{ secrets.SEATGEEK_API_KEY }},GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
